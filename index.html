<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение за Времето</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <main class="app" aria-label="Приложение за времето">
            
            <header class="app-header">
                <div class="brand">
                    <div class="logo" aria-hidden="true">
                        <span class="logo-dot"></span>
                        <span class="logo-arc"></span>
                    </div>
                    <div class="brand-text">
                        <p class="brand-title">Времето</p>
                    </div>
                </div>
                <div class="header-meta">
                    <button id="theme-btn" class="theme-toggle-btn">🌙 Тъмен режим</button>
                    <div class="time-container">
                        <p class="meta-label">Местно време</p>
                        <p class="meta-value" id="local-time">--:--</p>
                    </div>
                </div>
            </header>

            <section class="search-panel" aria-label="Търсене на град">
                <div class="search-input">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input type="text" id="city-input" placeholder="Търси град...">
                </div>
                <button class="search-button" id="search-btn" type="button">Търси</button>
            </section>

            <section class="weather-grid" aria-label="Преглед на времето">
                <article class="weather-card main-card" style="flex-wrap: wrap;">
                    <div class="card-header" style="flex: 1 1 100%;">
                        <p class="city-name" id="city-name">Име на града</p>
                        <p class="city-region" id="city-region">Държава</p>
                        
                        <button id="unit-toggle-btn" style="background: transparent; border: 1.5px solid var(--border); padding: 6px 12px; border-radius: 20px; color: var(--ink); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600; margin-top: 10px; transition: all 0.2s ease;">Промени на °F</button>
                    </div>
                    <div class="temperature" id="temp-box">
                        <span class="temp-value" id="temperature">--</span>
                        <span class="temp-unit">°</span>
                    </div>
                    <div class="condition" id="condition-box">
                        <span id="condition-icon"></span>
                        <div class="condition-text">
                            <p class="condition-label" id="condition">Състояние</p>
                        </div>
                    </div>
                    <p id="error-message" style="color: #ff7a59; font-weight: 600; display: none; font-size: 15px; width: 100%; text-align: center; margin-top: 15px; word-break: break-word; line-height: 1.4;"></p>
                </article>

                <article class="weather-card stat-card">
                    <p class="stat-label">Вятър</p>
                    <p class="stat-value" id="wind">-- км/ч</p>
                    <p class="stat-helper">Скорост</p>
                </article>

                <article class="weather-card stat-card">
                    <p class="stat-label">Усеща се</p>
                    <p class="stat-value" id="feels-like">-- °C</p>
                    <p class="stat-helper">Индекс на комфорт</p>
                </article>

                <article class="weather-card stat-card">
                    <p class="stat-label">Валежи</p>
                    <p class="stat-value" id="precipitation">-- мм</p>
                    <p class="stat-helper">Количество</p>
                </article>
            </section>

            <section class="details-panel" aria-label="Допълнителни детайли">
                <div class="details-header">
                    <h2>Акценти днес</h2>
                    <p>Данни на живо</p>
                </div>
                <div class="details-grid">
                    <div class="detail-item">
                        <p class="detail-label">Изгрев</p>
                        <p class="detail-value" id="sunrise">--:--</p>
                    </div>
                    <div class="detail-item">
                        <p class="detail-label">Залез</p>
                        <p class="detail-value" id="sunset">--:--</p>
                    </div>
                    <div class="detail-item">
                        <p class="detail-label">Влажност</p>
                        <p class="detail-value" id="humidity">-- %</p>
                    </div>
                    <div class="detail-item">
                        <p class="detail-label">Налягане</p>
                        <p class="detail-value" id="pressure">-- хПа</p>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
