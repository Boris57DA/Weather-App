<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение за Времето</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="page">
        <main class="app" aria-label="Приложение за времето">
            <header class="app-header">
                <div class="brand">
                    <div class="logo" aria-hidden="true">
                        <span class="logo-dot"></span>
                        <span class="logo-arc"></span>
                    </div>
                    <div class="brand-text">
                        <p class="brand-title">Времето</p>
                    </div>
                </div>
                <div class="header-meta">
                    <p class="meta-label">Местно време</p>
                    <p class="meta-value">--:--</p>
                </div>
            </header>

            <section class="search-panel" aria-label="Търсене на град">
                <div class="search-input">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input type="text" placeholder="Търси град..." aria-label="Търси град">
                </div>
                <button class="search-button" type="button">Търси</button>
            </section>

            <section class="weather-grid" aria-label="Преглед на времето">
                <article class="weather-card main-card">
                    <div class="card-header">
                        <p class="city-name">Име на града</p>
                        <p class="city-region">Държава</p>
                    </div>
                    <div class="temperature">
                        <span class="temp-value">--</span>
                        <span class="temp-unit">°C</span>
                    </div>
                    <div class="condition">
                        <span class="condition-icon" aria-hidden="true"></span>
                        <div class="condition-text">
                            <p class="condition-label">Състояние</p>
                        </div>
                    </div>
                </article>

                <article class="weather-card stat-card">
                    <p class="stat-label">Вятър</p>
                    <p class="stat-value">-- км/ч</p>
                    <p class="stat-helper">Скорост</p>
                </article>

                <article class="weather-card stat-card">
                    <p class="stat-label">Усеща се</p>
                    <p class="stat-value">-- °C</p>
                    <p class="stat-helper">Индекс на комфорт</p>
                </article>

                <article class="weather-card stat-card">
                    <p class="stat-label">Валежи</p>
                    <p class="stat-value">-- мм</p>
                    <p class="stat-helper">Количество</p>
                </article>
            </section>

            <section class="details-panel" aria-label="Допълнителни детайли">
                <div class="details-header">
                    <h2>Акценти днес</h2>
                    <p>Данни на живо</p>
                </div>
                <div class="details-grid">
                    <div class="detail-item">
                        <p class="detail-label">Изгрев</p>
                        <p class="detail-value">--:--</p>
                    </div>
                    <div class="detail-item">
                        <p class="detail-label">Залез</p>
                        <p class="detail-value">--:--</p>
                    </div>
                    <div class="detail-item">
                        <p class="detail-label">Влажност</p>
                        <p class="detail-value">-- %</p>
                    </div>
                    <div class="detail-item">
                        <p class="detail-label">Налягане</p>
                        <p class="detail-value">-- хПа</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
